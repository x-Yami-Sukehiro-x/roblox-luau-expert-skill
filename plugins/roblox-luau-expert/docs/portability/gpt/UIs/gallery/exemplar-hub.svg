<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" font-family="Gotham, Montserrat, 'Segoe UI', sans-serif">
  <title>ExecutorHub.client.luau rendered at its maximum bounds, 460 x 560</title>

  <!-- A mid-grey stand-in for gameplay, so the surface ladder reads as it would in play. -->
  <rect width="900" height="620" fill="#3c4450"/>
  <rect width="900" height="620" fill="url(#noise)" opacity="0.5"/>
  <defs>
    <linearGradient id="noise" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a5361"/>
      <stop offset="1" stop-color="#2b323c"/>
    </linearGradient>
    <clipPath id="panelClip"><rect x="30" y="30" width="460" height="560" rx="10"/></clipPath>
    <!-- The toast is a CanvasGroup in the file, so its rounded corner clips the
         severity edge. Without this the 2 px strip draws a square corner over
         the round one - which is E-CORNERBLEED, drawn by accident. -->
    <clipPath id="toastOne"><rect x="550" y="404" width="320" height="60" rx="10"/></clipPath>
    <clipPath id="toastTwo"><rect x="550" y="472" width="320" height="60" rx="10"/></clipPath>
  </defs>

  <!-- PANEL: CanvasGroup, TOKENS.base 31,34,41, PANEL_RADIUS 10, 1px TOKENS.border -->
  <g clip-path="url(#panelClip)">
    <rect x="30" y="30" width="460" height="560" rx="10" fill="#1f2229"/>
  </g>
  <rect x="30.5" y="30.5" width="459" height="559" rx="10" fill="none" stroke="#3f444f" stroke-width="1"/>

  <!-- HEADER: 44 tall, horizontal UIListLayout, VerticalAlignment Center, padding 12 -->
  <!-- grip icon, 16 ink -->
  <g fill="#969daa">
    <circle cx="46" cy="58" r="1.4"/><circle cx="46" cy="64" r="1.4"/><circle cx="46" cy="70" r="1.4"/>
    <circle cx="52" cy="58" r="1.4"/><circle cx="52" cy="64" r="1.4"/><circle cx="52" cy="70" r="1.4"/>
  </g>
  <!-- title: 16px, GothamBold, TextYAlignment Center -->
  <text x="66" y="69" fill="#f3f5f8" font-size="16" font-weight="700">Field Kit</text>

  <!-- close: 44 x 44 button, 16 of ink, CONTROL_RADIUS 6 -->
  <rect x="434" y="42" width="44" height="44" rx="6" fill="#2c3039"/>
  <g stroke="#969daa" stroke-width="1.7" stroke-linecap="round">
    <line x1="450" y1="58" x2="462" y2="70"/>
    <line x1="462" y1="58" x2="450" y2="70"/>
  </g>

  <!-- BODY: ScrollingFrame, UIFlexItem Fill, 8 gap. Row one hovered, row two at rest. -->
  <rect x="42" y="98" width="436" height="44" rx="6" fill="#2c3039"/>
  <text x="54" y="125" fill="#f3f5f8" font-size="14">Highlight nearby players</text>
  <rect x="450" y="112" width="16" height="16" rx="6" fill="#2ea07f"/>

  <text x="54" y="177" fill="#f3f5f8" font-size="14">Log remote traffic</text>
  <rect x="450" y="164" width="16" height="16" rx="6" fill="#3f444f"/>

  <!-- TOASTS: bottom-right, 16 inset, 320 wide, 8 gap. Same fill, radius and stroke as the panel. -->
  <g>
    <rect x="550" y="404" width="320" height="60" rx="10" fill="#3f444f"/>
    <rect x="550.5" y="404.5" width="319" height="59" rx="10" fill="none" stroke="#3f444f"/>
    <rect x="550" y="404" width="2" height="60" fill="#588dd6" clip-path="url(#toastOne)"/>
    <circle cx="570" cy="434" r="8" fill="none" stroke="#588dd6" stroke-width="1.6"/>
    <line x1="570" y1="431" x2="570" y2="438" stroke="#588dd6" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="570" cy="428" r="0.9" fill="#588dd6"/>
    <text x="586" y="439" fill="#f3f5f8" font-size="14">Loaded for Player1</text>
  </g>

  <g>
    <rect x="550" y="472" width="320" height="60" rx="10" fill="#3f444f"/>
    <rect x="550.5" y="472.5" width="319" height="59" rx="10" fill="none" stroke="#3f444f"/>
    <rect x="550" y="472" width="2" height="60" fill="#48b270" clip-path="url(#toastTwo)"/>
    <polyline points="564,502 569,507 578,497" fill="none" stroke="#48b270" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="586" y="507" fill="#f3f5f8" font-size="14">Highlights on</text>
  </g>

  <!-- What the picture is for -->
  <text x="550" y="70" fill="#cdd2db" font-size="13" font-weight="700">What to look at</text>
  <text x="550" y="94" fill="#969daa" font-size="12">44 px close button, 16 px of ink inside it</text>
  <text x="550" y="114" fill="#969daa" font-size="12">Title vertically centred in a 44 px row</text>
  <text x="550" y="134" fill="#969daa" font-size="12">One accent, on the one thing that is on</text>
  <text x="550" y="154" fill="#969daa" font-size="12">Toast fill, radius and stroke = the panel's</text>
  <text x="550" y="174" fill="#969daa" font-size="12">Severity on a 2 px edge and the icon,</text>
  <text x="550" y="192" fill="#969daa" font-size="12">never the whole fill</text>
  <text x="550" y="220" fill="#646b79" font-size="11">Drawn from the token values in the file.</text>
  <text x="550" y="236" fill="#646b79" font-size="11">Panel shown at its 460 x 560 maximum.</text>
</svg>
