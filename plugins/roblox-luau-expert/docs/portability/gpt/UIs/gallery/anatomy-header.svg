<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" font-family="Gotham, Montserrat, 'Segoe UI', sans-serif">
  <title>The header row: what each number is, and the two ways it goes wrong</title>
  <rect width="900" height="460" fill="#14171c"/>

  <text x="40" y="38" fill="#f3f5f8" font-size="16" font-weight="700">The header row</text>
  <text x="40" y="60" fill="#969daa" font-size="12">One horizontal UIListLayout. Three children and a slack element. No Position anywhere.</text>

  <!-- ============ RIGHT ============ -->
  <text x="40" y="104" fill="#48b270" font-size="12" font-weight="700">RIGHT</text>

  <rect x="40" y="116" width="560" height="44" fill="#1f2229" stroke="#3f444f"/>
  <!-- padding guides -->
  <line x1="52" y1="112" x2="52" y2="164" stroke="#2ea07f" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="588" y1="112" x2="588" y2="164" stroke="#2ea07f" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- LayoutOrder 1: grip, 16 -->
  <rect x="52" y="130" width="16" height="16" fill="none" stroke="#588dd6" stroke-dasharray="2 2"/>
  <g fill="#969daa">
    <circle cx="57" cy="134" r="1.3"/><circle cx="57" cy="138" r="1.3"/><circle cx="57" cy="142" r="1.3"/>
    <circle cx="63" cy="134" r="1.3"/><circle cx="63" cy="138" r="1.3"/><circle cx="63" cy="142" r="1.3"/>
  </g>

  <!-- LayoutOrder 2: title, AutomaticSize X, TextYAlignment Center -->
  <text x="76" y="143" fill="#f3f5f8" font-size="16" font-weight="700">Field Kit</text>
  <!-- the centre line the title sits on -->
  <line x1="40" y1="138" x2="600" y2="138" stroke="#2ea07f" stroke-width="1" stroke-dasharray="4 4" opacity="0.6"/>

  <!-- LayoutOrder 3: slack, UIFlexItem Fill -->
  <rect x="168" y="122" width="368" height="32" fill="#2ea07f" opacity="0.1"/>
  <text x="300" y="142" fill="#2ea07f" font-size="11">UIFlexItem  FlexMode = Fill</text>

  <!-- LayoutOrder 4: close, 44 x 44 -->
  <rect x="544" y="116" width="44" height="44" rx="6" fill="#2c3039"/>
  <rect x="558" y="130" width="16" height="16" fill="none" stroke="#588dd6" stroke-dasharray="2 2"/>
  <g stroke="#cdd2db" stroke-width="1.7" stroke-linecap="round">
    <line x1="560" y1="132" x2="572" y2="144"/><line x1="572" y1="132" x2="560" y2="144"/>
  </g>

  <!-- dimension: 44 tall -->
  <line x1="620" y1="116" x2="620" y2="160" stroke="#969daa" stroke-width="1"/>
  <line x1="616" y1="116" x2="624" y2="116" stroke="#969daa" stroke-width="1"/>
  <line x1="616" y1="160" x2="624" y2="160" stroke="#969daa" stroke-width="1"/>
  <text x="632" y="142" fill="#969daa" font-size="12">44  header height = the touch target</text>

  <!-- dimension: close 44 wide -->
  <line x1="544" y1="174" x2="588" y2="174" stroke="#969daa" stroke-width="1"/>
  <line x1="544" y1="170" x2="544" y2="178" stroke="#969daa" stroke-width="1"/>
  <line x1="588" y1="170" x2="588" y2="178" stroke="#969daa" stroke-width="1"/>
  <text x="460" y="192" fill="#969daa" font-size="12">44 of reach</text>
  <text x="596" y="192" fill="#588dd6" font-size="12">16 of ink</text>

  <text x="40" y="216" fill="#969daa" font-size="12">LayoutOrder 1 grip · 2 title · 3 slack · 4 close.  Padding 12 either side.  Row gap 8.</text>

  <!-- ============ WRONG 1 ============ -->
  <text x="40" y="262" fill="#d05852" font-size="12" font-weight="700">WRONG — two Positions, no layout</text>
  <rect x="40" y="274" width="560" height="44" fill="#1f2229" stroke="#3f444f"/>
  <line x1="40" y1="296" x2="600" y2="296" stroke="#d05852" stroke-width="1" stroke-dasharray="4 4" opacity="0.6"/>
  <!-- title too high: TextYAlignment Top in a fixed-height row -->
  <text x="52" y="290" fill="#f3f5f8" font-size="16" font-weight="700">Field Kit</text>
  <!-- close: a letter, and a 24px box that does not line up -->
  <rect x="560" y="280" width="24" height="24" rx="4" fill="#2c3039"/>
  <text x="566" y="298" fill="#cdd2db" font-size="16">&#215;</text>
  <text x="620" y="292" fill="#d05852" font-size="12">title sits 6 px high; close is 24, not 44;</text>
  <text x="620" y="310" fill="#d05852" font-size="12">the mark is a font glyph on the baseline</text>

  <!-- ============ WRONG 2 ============ -->
  <text x="40" y="360" fill="#d05852" font-size="12" font-weight="700">WRONG — layout, but the gap is a Position offset</text>
  <rect x="40" y="372" width="560" height="44" fill="#1f2229" stroke="#3f444f"/>
  <text x="52" y="399" fill="#f3f5f8" font-size="16" font-weight="700">Field Kit</text>
  <rect x="430" y="372" width="44" height="44" rx="6" fill="#2c3039"/>
  <g stroke="#cdd2db" stroke-width="1.7" stroke-linecap="round">
    <line x1="444" y1="388" x2="456" y2="400"/><line x1="456" y1="388" x2="444" y2="400"/>
  </g>
  <rect x="474" y="372" width="126" height="44" fill="#d05852" opacity="0.12"/>
  <text x="620" y="398" fill="#d05852" font-size="12">right at one width, wrong at every other</text>
</svg>
